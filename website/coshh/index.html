<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COSHH AI Database</title>
<meta name="description" content="Full 16-section safety data sheets with UK EH40 exposure limits, COSHH guidance for health and safety officers, and IR, NMR and GC-MS spectra, for any substance." />
<link rel="icon" href="/img/logo-mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/img/logo-mark.svg" />
<link rel="stylesheet" href="../css/main.css" />
<style>
  :root { --teal: #0d9488; --crit: #b91c1c; --crit-bg: #fef2f2; --warn: #b45309; --warn-bg: #fffbeb;
          --info: #0f766e; --info-bg: #f0fdfa; --plot1: #0d9488; --plot2: #eb6834; --grid: rgba(20,18,14,0.07); }
  body { background: var(--bg); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 88px 20px 80px; }
  .dbhero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 8px; }
  .dbhero p { max-width: 720px; }
  .search { position: relative; margin: 22px 0 6px; display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 13px 16px; border-radius: var(--radius);
                  border: 1px solid var(--border-hi); background: var(--surface); color: var(--text); }
  .search input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .suggest { position: absolute; top: 52px; left: 0; right: 110px; background: var(--surface); border: 1px solid var(--border-hi);
             border-radius: var(--radius-sm); box-shadow: 0 8px 24px rgba(0,0,0,.08); z-index: 20; display: none; max-height: 320px; overflow: auto; }
  .suggest button { display: block; width: 100%; text-align: left; padding: 9px 14px; border: 0; background: none; font: inherit; font-size: 14px; color: var(--text); cursor: pointer; }
  .suggest button:hover, .suggest button.active { background: var(--surface2); }
  .examples { font-size: 13px; color: var(--muted); }
  .examples button { border: 1px solid var(--border-hi); background: var(--surface); border-radius: 999px; padding: 3px 11px; margin: 4px 4px 0 0; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
  .status { margin: 18px 0; font-size: 14px; color: var(--muted); }
  .status.err { color: var(--crit); }
  .head { display: grid; grid-template-columns: 150px 1fr; gap: 20px; background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); padding: 18px; margin-top: 18px; }
  .head img.struct { width: 150px; height: 150px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--border); }
  .head h2 { font-size: 1.6rem; margin-bottom: 4px; }
  .ids { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
  .ids b { color: var(--text); font-weight: 600; }
  .picto { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .picto img { width: 54px; height: 54px; }
  .signal { font-weight: 700; font-size: 15px; padding: 3px 12px; border-radius: 6px; margin-left: 6px; }
  .signal.Danger { background: var(--crit); color: #fff; } .signal.Warning { background: #f59e0b; color: #1c1917; }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .flag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .flag.critical { background: var(--crit-bg); color: var(--crit); border: 1px solid #fecaca; }
  .flag.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #fde68a; }
  .flag.info { background: var(--info-bg); color: var(--info); border: 1px solid #99f6e4; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .actions .btn { padding: 7px 14px; font-size: 13px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-hi); margin: 22px 0 0; overflow-x: auto; }
  .tabs button { border: 0; background: none; font: inherit; font-size: 14px; font-weight: 500; padding: 10px 14px; color: var(--muted);
                 border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--teal); }
  .panel { display: none; padding-top: 16px; } .panel.on { display: block; }
  .sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin: 10px 0; }
  .sec > summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec > summary .n { color: var(--teal); min-width: 26px; }
  .sec > summary .c { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--dim); }
  .sec .body { padding: 0 16px 14px 52px; }
  .blk { margin: 10px 0 14px; } .blk h4 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .blk ul { padding-left: 18px; } .blk li { font-size: 14px; line-height: 1.6; margin: 3px 0; color: var(--text); }
  .blk li.hidden { display: none; } .blk.open li.hidden { display: list-item; }
  .more { border: 0; background: none; color: var(--teal); font: inherit; font-size: 13px; cursor: pointer; padding: 2px 0; }
  sup a { color: var(--teal); font-size: 11px; margin-left: 2px; }
  .none { font-size: 14px; color: var(--dim); font-style: italic; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
  table.t th, table.t td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.t th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .tw { overflow-x: auto; }
  .hcode { font-weight: 700; white-space: nowrap; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--info); border-radius: var(--radius); padding: 14px 16px; }
  .card.critical { border-left-color: var(--crit); } .card.warn { border-left-color: #f59e0b; }
  .card .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card h3 { margin: 2px 0 8px; font-size: 15px; }
  .card ul { padding-left: 18px; } .card li { font-size: 14px; line-height: 1.55; margin: 4px 0; color: var(--text); }
  .card .basis { font-size: 12px; color: var(--muted); margin-top: 8px; border-top: 1px dashed var(--border-hi); padding-top: 6px; }
  .callout { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; color: var(--muted); margin: 10px 0; }
  .callout b { color: var(--text); }
  .spec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
  .spec h3 { margin-bottom: 4px; } .spec .src { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  svg.plot { width: 100%; height: auto; display: block; }
  svg.plot .grid { stroke: var(--grid); } svg.plot .axis { stroke: var(--border-hi); }
  svg.plot .p-tick { font-size: 11px; fill: var(--muted); } svg.plot .p-label { font-size: 12px; fill: var(--muted); text-transform: none; letter-spacing: 0; }
  svg.plot .p-peak { font-size: 10px; fill: var(--text); }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin: 0 4px 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .row select, .row input[type=text], .row input[type=date], textarea { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--border-hi); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
  .chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface2); color: var(--muted); margin: 2px 4px 2px 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .overdue { color: var(--crit); font-weight: 600; }
  .drop { border: 2px dashed var(--border-hi); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }
  .drop.over { border-color: var(--teal); background: var(--info-bg); }
  .print-only { display: none; }
  @media (max-width: 640px) {
    .head { grid-template-columns: 1fr; } .head img.struct { width: 120px; height: 120px; }
    .sec .body { padding-left: 16px; } .suggest { right: 0; }
  }
  @media print {
    .nav, .dbhero, .status, .tabs, .actions, .noprint, .more { display: none !important; }
    .wrap { padding: 0; max-width: none; } .panel { display: block !important; }
    .sec { break-inside: avoid-page; border: 0; border-top: 1px solid #ccc; border-radius: 0; }
    .blk li.hidden { display: list-item !important; }
    .print-only { display: block; } .card { break-inside: avoid; }
    details.sec > .body { display: block !important; }
  }
</style>
  <script src="/js/session.js"></script>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="/img/logo-mark.svg" alt="" width="26" height="26" style="vertical-align:-7px;margin-right:8px;border-radius:6px" />Lyra AI</a>
    <div class="nav-cta">
      <a href="/pages/coshh.html" class="btn btn-outline" style="padding:7px 16px;font-size:13px;">About COSHH AI</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="dbhero">
    <h1>COSHH AI <span style="color:var(--teal)">Database</span></h1>
    <p>Look up any substance: a full 16-section safety data sheet, UK EH40 exposure limits, the COSHH points
      a classic SDS leaves out, and stored IR, NMR, GC-MS and GC data. You can also attach your own lab spectra and supplier SDS PDFs.</p>
    <form class="search" id="searchForm" autocomplete="off" role="search">
      <input id="q" type="search" placeholder="Name or CAS number, e.g. acetone or 67-64-1" aria-label="Substance name or CAS number" />
      <button class="btn btn-primary" type="submit" style="padding:0 20px;">Look up</button>
      <div class="suggest" id="suggest" role="listbox"></div>
    </form>
    <div class="examples">Try:
      <button data-q="acetone">acetone</button><button data-q="formaldehyde">formaldehyde</button>
      <button data-q="7647-01-0">7647-01-0 (HCl)</button><button data-q="toluene">toluene</button>
      <button data-q="sodium hypochlorite">sodium hypochlorite</button><button data-q="diethyl ether">diethyl ether</button>
      <button data-q="isocyanic acid, methylenedi-p-phenylene ester">MDI</button>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="result"></div>

  <section id="libraryHome" class="noprint" style="margin-top:28px;"></section>
</main>

<script src="spectra.js"></script>
<script src="app.js"></script>
</body>
</html>
