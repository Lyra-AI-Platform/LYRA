<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>My Lyra</title>
  <link rel="icon" href="/img/logo-mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/img/logo-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" />
  <link rel="stylesheet" href="/css/main.css" />
  <script src="/js/session.js"></script>
  <script src="/js/appnav.js"></script>
  <style>
    :root {
      --ink: #14120e; --paper: #faf9f7; --sheet: #ffffff; --rule: rgba(20,18,14,.09);
      --open: #15803d; --trial: #b45309; --locked: #a8a5a0; --signal: #e11d48;
      --mono: 'JetBrains Mono', 'SF Mono', monospace; --serif: 'Instrument Serif', Georgia, serif;
    }
    body {
      background:
        radial-gradient(1200px 500px at 85% -10%, rgba(225,29,72,.07), transparent 60%),
        radial-gradient(900px 500px at -10% 10%, rgba(180,83,9,.06), transparent 60%),
        linear-gradient(var(--rule) 1px, transparent 1px) 0 0 / 100% 32px,
        var(--paper);
      min-height: 100vh;
    }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1080px; margin:0 auto; padding:20px 24px; }
    .brand { font-weight:600; font-size:15px; }
    .top-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .top-actions .btn { padding:7px 14px; font-size:13px; }
    main { max-width:1080px; margin:0 auto; padding:24px 24px 96px; }

    .hello { padding:40px 0 28px; border-bottom:1px solid var(--rule); margin-bottom:28px; }
    .kicker { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .hello h1 { font-family:var(--serif); font-weight:400; font-size:clamp(2.4rem,6vw,4.2rem); letter-spacing:-.01em; line-height:1.02; margin:10px 0 14px; }
    .hello h1 em { color:var(--signal); }
    .status { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { font-family:var(--mono); font-size:12px; padding:6px 10px; border:1px solid var(--rule); border-radius:999px; background:var(--sheet); white-space:nowrap; }
    .chip b { font-weight:600; }
    .chip.warn { border-color:rgba(180,83,9,.35); color:var(--trial); }

    h2.group { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:34px 0 12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
    .tile {
      position:relative; display:flex; flex-direction:column; gap:6px; min-height:132px;
      padding:18px 18px 16px; background:var(--sheet); border:1px solid var(--rule); border-radius:12px;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      opacity:0; animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .tile:hover { opacity:1; transform:translateY(-2px); border-color:rgba(20,18,14,.22); box-shadow:0 10px 30px rgba(20,18,14,.08); }
    .tile:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    .tile .ico { font-size:20px; line-height:1; }
    .tile h3 { font-size:15px; margin-top:6px; }
    .tile p { font-size:13px; line-height:1.5; margin:0; }
    .tile .state { margin-top:auto; padding-top:8px; font-family:var(--mono); font-size:11px; letter-spacing:.04em; display:flex; align-items:center; gap:6px; }
    .state::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .state.open { color:var(--open); } .state.trial { color:var(--trial); } .state.locked { color:var(--locked); }
    .state.info { color:var(--muted); } .state.info::before { display:none; }
    .tile.locked h3, .tile.locked p { color:var(--muted); }
    .tile.feature { background:var(--ink); border-color:var(--ink); }
    .tile.feature h3 { color:var(--paper); } .tile.feature p { color:rgba(250,249,247,.65); }
    .tile.feature .state.open { color:#4ade80; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { .tile { animation:none; opacity:1; } .tile:hover { transform:none; } }
    @media (max-width:560px) { .top { padding:16px; } main { padding:12px 16px 80px; } .hello { padding-top:20px; } }
  </style>
</head>
<body>
<header class="top" data-appnav-hide>
  <a href="/" class="brand"><img src="/img/logo-mark.svg" alt="" width="24" height="24" style="vertical-align:-6px;margin-right:8px;border-radius:6px" />Lyra AI</a>
  <div class="top-actions">
    <a class="btn btn-outline" href="/account/">Account</a>
    <a class="btn btn-outline" href="/dashboard/billing.html">Billing</a>
    <button class="btn btn-outline" type="button" id="signout">Sign out</button>
  </div>
</header>

<main>
  <section class="hello">
    <div class="kicker" id="today">Your Lyra</div>
    <h1 id="greet">Welcome back.</h1>
    <div class="status" id="status"><span class="chip">Loading your plan…</span></div>
  </section>

  <h2 class="group">Your products</h2>
  <div class="grid" id="products"></div>

  <h2 class="group">Account &amp; developer</h2>
  <div class="grid" id="account"></div>

  <h2 class="group">Explore</h2>
  <div class="grid" id="explore"></div>
</main>

<script>
(function () {
  // Only served to a signed-in browser (lyra/api/page_access.py); the cookie does the rest.
  document.getElementById('signout').onclick = () => window.lyraSignOut('/');
  document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

  // access: open | trial | locked | info. Locked tiles go to the page that unlocks them.
  const PRODUCTS = [
    { id: 'market', ico: '📈', name: 'Tremor Index', text: 'Market stress readings, news and history.', href: '/market', need: 'member', feature: true },
    { id: 'chat', ico: '✦', name: 'Lyra chat', text: 'Ask Lyra anything; it searches the web when it needs to.', href: '/dashboard/chat.html', need: 'member' },
    { id: 'watch_live', ico: '🔴', name: 'Lyra Watch Live', text: 'The real-time stream of who is moving markets.', href: '/watch/live/', need: 'watch', unlock: '/watch/account/?need=watch' },
    { id: 'coshh', ico: '⚗️', name: 'COSHH database', text: 'Safety data sheets, exposure limits and spectra.', href: '/coshh/', need: 'member' },
    { id: 'sites', ico: '🛡️', name: 'LyraAuth sites', text: 'Your sites, keys, usage and training data.', href: '/dashboard/', need: 'account' },
  ];
  const ACCOUNT = [
    { ico: '🔒', name: 'Account & security', text: 'Password, signed-in browsers, sign out everywhere.', href: '/account/' },
    { ico: '💳', name: 'Billing & plan', text: 'Change plan, invoices, cancel.', href: '/dashboard/billing.html' },
    { ico: '🔑', name: 'Watch Pro & API keys', text: 'Subscription, API keys and credits for agents.', href: '/watch/account/' },
    { ico: '📚', name: 'Documentation', text: 'Install the widget and call the APIs.', href: '/pages/docs.html' },
  ];
  const EXPLORE = [
    { ico: '👥', name: 'Lyra Watch directory', text: 'Every public figure we track.', href: '/watch/' },
    { ico: '🧪', name: 'Tremor methodology', text: 'Backtest and track record.', href: '/tremor/' },
    { ico: '📣', name: 'Advertise', text: 'Sponsor slots on Lyra Watch.', href: '/advertise/' },
    { ico: '🏢', name: 'Lyra Labs', text: 'Everything we make.', href: '/company/' },
    { ico: '🏠', name: 'Public homepage', text: 'What visitors see.', href: '/index.html' },
  ];

  let n = 0;
  function tile(t, access, stateText) {
    const a = document.createElement('a');
    const locked = access === 'locked';
    a.className = 'tile' + (locked ? ' locked' : '') + (t.feature && !locked ? ' feature' : '');
    a.href = locked ? (t.unlock || '/dashboard/billing.html?need=' + (t.id || '')) : t.href;
    a.style.animationDelay = (n++ * 45) + 'ms';
    const ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = t.ico;
    const h = document.createElement('h3'); h.textContent = t.name;
    const p = document.createElement('p'); p.textContent = t.text;
    const s = document.createElement('span'); s.className = 'state ' + access; s.textContent = stateText;
    a.append(ico, h, p, s);
    return a;
  }
  function fill(id, items, fn) {
    const box = document.getElementById(id);
    box.replaceChildren(...items.map(fn));
  }
  function chip(html, warn) {
    const c = document.createElement('span'); c.className = 'chip' + (warn ? ' warn' : ''); c.innerHTML = html; return c;
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function get(url) {
    const r = await fetch(url);
    if (r.status === 401) { window.lyraSignOut('/dashboard/login.html'); throw new Error('signed out'); }
    return r.ok ? r.json() : null;
  }

  Promise.all([get('/api/users/me'), get('/api/billing/status'), get('/api/watch/account').catch(() => null)])
    .then(([me, bill, watch]) => {
      const name = (me && me.name) || '';
      const hour = new Date().getHours();
      const part = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
      document.getElementById('greet').innerHTML = `Good ${part}${name ? ', <em>' + esc(name) + '</em>' : ''}.`;

      const paid = !!(bill && bill.paid);
      const trial = bill && bill.trial;
      const trialOn = trial && !trial.expired;
      const watchOn = !!(watch && watch.watch_pro);
      const st = document.getElementById('status');
      st.replaceChildren();
      const tier = (bill && bill.tier) || (me && me.tier) || 'free';
      st.append(chip('Plan <b>' + esc(paid ? tier[0].toUpperCase() + tier.slice(1) : 'Trial') + '</b>'));
      if (trial) st.append(trial.expired ? chip('Trial ended · <b>choose a plan</b>', true)
                                         : chip('<b>' + trial.days_left + '</b> trial day' + (trial.days_left === 1 ? '' : 's') + ' left', trial.days_left <= 3));
      st.append(chip('Watch Pro <b>' + (watchOn ? 'on' : 'off') + '</b>'));
      if (watch && watch.credits) st.append(chip('API credits <b>' + Number(watch.credits.balance).toLocaleString() + '</b>'));

      fill('products', PRODUCTS, t => {
        if (t.need === 'account') return tile(t, 'open', 'Open');
        if (t.need === 'watch') return watchOn ? tile(t, 'open', 'Open') : tile(t, 'locked', 'Needs Watch Pro · unlock');
        if (paid) return tile(t, 'open', 'Included in your plan');
        if (!trialOn) return tile(t, 'locked', 'Trial ended · choose a plan');
        const left = trial.remaining && trial.remaining[t.id];
        return tile(t, 'trial', left == null ? 'Trial' : `Trial · ${left} left`);
      });
      fill('account', ACCOUNT, t => tile(t, 'info', 'Open →'));
      fill('explore', EXPLORE, t => tile(t, 'info', 'Open →'));
    })
    .catch(() => {});
})();
</script>
</body>
</html>
